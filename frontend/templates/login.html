{% extends 'base.html' %}
{% block title %}Login — SilentLink{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card fade-up">
        <div class="auth-header">
            <span class="eyebrow">Welcome back</span>
            <h1>Sign in to SilentLink</h1>
            <p>Continue your sign language journey.</p>
        </div>
        
        {% if error %}
        <div class="alert alert-error" style="color: var(--rose); background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.9rem;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required
                    autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required
                    autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary">Sign In →</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="/signup">Create one free</a></p>
    </div>
</section>
{% endblock %}
