# docker-compose.yml for SilentLink
version: '3.8'

services:
  silentlink:
    build: .
    container_name: silentlink-app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here-change-in-production}
      - DATABASE_URL=sqlite:////var/data/silentlink.db
      - HOST=0.0.0.0
      - PORT=8000
      - SESSION_COOKIE_NAME=silentlink_session
      - SESSION_COOKIE_SECURE=false
    volumes:
      - silentlink-data:/var/data
      - ./assets:/app/assets:ro
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - silentlink-network

volumes:
  silentlink-data:
    driver: local

networks:
  silentlink-network:
    driver: bridge